server:
  port: 8090

spring:
  application:
    name: GATEWAY-SERVICE

  # OAuth2 Resource Server - Keycloak JWT
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/salud-system

  # Spring Cloud Gateway - Rutas (namespace 2025.1)
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # Ruta hacia Pacientes Service
            - id: pacientes-service
              uri: lb://PACIENTES-SERVICE
              predicates:
                - Path=/api/pacientes/**

            # Ruta hacia Historial Médico Service
            - id: historial-medico-service
              uri: lb://HISTORIAL-MEDICO-SERVICE
              predicates:
                - Path=/api/historiales/**

            # Ruta hacia Pacientes FastAPI Service (Usuarios y Consultas)
            - id: pacientes-fastapi-service
              uri: lb://PACIENTES-FASTAPI-SERVICE
              predicates:
                - Path=/api/usuarios/**, /api/consultas/**

# Eureka Client Configuration
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

# Logging
logging:
  level:
    com.salud.gateway: DEBUG
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: DEBUG

# Actuator - health checks para Docker Compose y Kubernetes (probes)
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
