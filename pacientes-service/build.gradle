plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.salud'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

ext {
    set('springCloudVersion', '2025.1.2')
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

dependencies {
    // Web
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // Actuator (health checks para Docker y Kubernetes)
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // JPA + PostgreSQL
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'org.postgresql:postgresql'

    // Security - OAuth2 Resource Server (Keycloak)
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

    // Eureka Client
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'

    // Kafka - log de eventos entre microservicios.
    // OJO: tiene que ser el STARTER, no 'org.springframework.kafka:spring-kafka'
    // a secas. En Spring Boot 4 las autoconfiguraciones se repartieron en
    // módulos propios, así que la librería suelta trae las clases pero NO crea
    // el KafkaTemplate ni la factory de @KafkaListener: el arranque falla con
    // "required a bean of type 'KafkaTemplate' that could not be found".
    implementation 'org.springframework.boot:spring-boot-starter-kafka'

    // Validation
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}
