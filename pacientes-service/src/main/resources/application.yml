server:
  port: 8081

spring:
  application:
    name: PACIENTES-SERVICE

  # PostgreSQL Configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/pacientes_db
    username: admin
    password: admin123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # RabbitMQ - mensajería asíncrona y RPC entre microservicios
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

    template:
      # Cuánto espera el cliente RPC la respuesta antes de rendirse. Si expira,
      # convertSendAndReceive devuelve null (ver HistorialRpcClient).
      reply-timeout: 5s

    listener:
      simple:
        acknowledge-mode: auto
        # Clave: sin esto, un mensaje que falla se reencola indefinidamente y
        # bloquea la cola. En false, al agotar los reintentos se va al DLX.
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2s
          multiplier: 2

  # OAuth2 Resource Server - Keycloak JWT
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/salud-system

# Eureka Client Configuration
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

# Logging
logging:
  level:
    com.salud.pacientes: DEBUG
    org.springframework.security: DEBUG
    # Sube a DEBUG para ver cada mensaje que entra y sale del broker.
    org.springframework.amqp: INFO

# Actuator - health checks para Docker Compose y Kubernetes (probes)
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
