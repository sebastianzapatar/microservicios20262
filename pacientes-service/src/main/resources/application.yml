server:
  port: 8081

spring:
  application:
    name: PACIENTES-SERVICE

  # PostgreSQL Configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/pacientes_db
    username: admin
    password: admin123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # Kafka - log de eventos entre microservicios
  kafka:
    bootstrap-servers: localhost:9094

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      # acks=all: el productor espera a que el mensaje quede confirmado por
      # todas las réplicas sincronizadas antes de darlo por bueno. Con un solo
      # broker no cambia gran cosa, pero es lo que se querría en producción.
      acks: all
      properties:
        # Evita duplicados si el productor reintenta tras un fallo de red.
        enable.idempotence: true
        # NO escribir la clase Java del emisor en una cabecera. Por defecto
        # Spring Kafka la manda y el receptor exige esa MISMA clase, lo que
        # rompe entre paquetes distintos (com.salud.pacientes vs
        # com.salud.historial) y es imposible con Python. Es el equivalente al
        # TypePrecedence.INFERRED que se usó con RabbitMQ.
        spring.json.add.type.headers: false

    consumer:
      group-id: pacientes-service
      # earliest: un consumer group NUEVO empieza en el offset 0 y reproduce
      # todo el log. Esto es lo que reconstruye la réplica local sin tener que
      # preguntarle nada a nadie, y es la razón de que esta rama no necesite RPC.
      auto-offset-reset: earliest
      # Los offsets los confirma Spring cuando el listener termina bien, no al
      # recibir: si el proceso muere a mitad, el mensaje se vuelve a entregar.
      enable-auto-commit: false
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        # ErrorHandlingDeserializer envuelve al de verdad para que un mensaje
        # corrupto no tumbe al consumidor. Sin esto el fallo ocurre ANTES de que
        # exista el listener, y el consumidor entra en un bucle infinito
        # reintentando el mismo mensaje ilegible.
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.salud.pacientes.dto.evento.HistorialEvento
        spring.json.trusted.packages: "*"

  # OAuth2 Resource Server - Keycloak JWT
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/salud-system

# Eureka Client Configuration
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

# Logging
logging:
  level:
    com.salud.pacientes: DEBUG
    org.springframework.security: DEBUG
    # Sube a DEBUG para ver cada mensaje que entra y sale del broker.
    org.springframework.kafka: INFO
    # En WARN porque el cliente de Kafka avisa muy ruidosamente mientras el
    # broker todavía está arrancando.
    org.apache.kafka.clients: WARN

# Actuator - health checks para Docker Compose y Kubernetes (probes)
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
