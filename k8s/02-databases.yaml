# ==========================================
# BASES DE DATOS
#
# Las tres siguen el mismo patrón:
#   PVC        -> pide disco persistente (los datos sobreviven al reinicio del Pod)
#   Deployment -> corre el motor de base de datos
#   Service    -> le da un nombre DNS fijo dentro del clúster
#
# ⚠️ strategy: Recreate
# Un PVC con accessMode ReadWriteOnce solo puede estar montado por UN Pod a la
# vez. Con la estrategia por defecto (RollingUpdate), Kubernetes intentaría
# crear el Pod nuevo ANTES de borrar el viejo, y el nuevo se quedaría en
# Pending para siempre ("Multi-Attach error" / "volume is already used").
# Recreate apaga el Pod viejo primero. Para bases de datos es lo correcto.
# ==========================================

# ------------------------------------------
# POSTGRESQL (Pacientes)
# ------------------------------------------
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-salud
  labels:
    app: postgres-salud
    tier: database
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres-salud
  template:
    metadata:
      labels:
        app: postgres-salud
        tier: database
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        env:
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: salud-config
              key: POSTGRES_DB
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: salud-secrets
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: salud-secrets
              key: POSTGRES_PASSWORD
        # El volumen se monta en un subdirectorio: si PostgreSQL arranca sobre
        # el raíz del volumen y este no está vacío (ej. lost+found), falla.
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        ports:
        - containerPort: 5432
          name: postgres
        # $POSTGRES_USER/$POSTGRES_DB vienen del Secret y el ConfigMap: la sonda
        # no repite las credenciales, así que sigue funcionando si se cambian.
        readinessProbe:
          exec:
            command: ["sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
          periodSeconds: 5
          failureThreshold: 30
        livenessProbe:
          exec:
            command: ["sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
          initialDelaySeconds: 60
          periodSeconds: 20
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: postgres-data
        persistentVolumeClaim:
          claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-salud
spec:
  selector:
    app: postgres-salud
  ports:
    - port: 5432
      targetPort: 5432

# ------------------------------------------
# MONGODB (Historial Médico)
# ------------------------------------------
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-salud
  labels:
    app: mongo-salud
    tier: database
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mongo-salud
  template:
    metadata:
      labels:
        app: mongo-salud
        tier: database
    spec:
      containers:
      - name: mongodb
        image: mongo:7
        env:
        - name: MONGO_INITDB_ROOT_USERNAME
          valueFrom:
            secretKeyRef:
              name: salud-secrets
              key: MONGO_USER
        - name: MONGO_INITDB_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: salud-secrets
              key: MONGO_PASSWORD
        - name: MONGO_INITDB_DATABASE
          valueFrom:
            configMapKeyRef:
              name: salud-config
              key: MONGO_DB
        ports:
        - containerPort: 27017
          name: mongodb
        readinessProbe:
          exec:
            command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
          periodSeconds: 5
          failureThreshold: 30
        livenessProbe:
          exec:
            command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
          initialDelaySeconds: 90
          periodSeconds: 20
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "768Mi"
        volumeMounts:
        - name: mongo-data
          mountPath: /data/db
      volumes:
      - name: mongo-data
        persistentVolumeClaim:
          claimName: mongo-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: mongo-salud
spec:
  selector:
    app: mongo-salud
  ports:
    - port: 27017
      targetPort: 27017

# ------------------------------------------
# MYSQL (Usuarios de FastAPI)
# ------------------------------------------
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-salud
  labels:
    app: mysql-salud
    tier: database
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mysql-salud
  template:
    metadata:
      labels:
        app: mysql-salud
        tier: database
    spec:
      containers:
      - name: mysql
        image: mysql:8.0
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: salud-secrets
              key: MYSQL_ROOT_PASSWORD
        - name: MYSQL_DATABASE
          valueFrom:
            configMapKeyRef:
              name: salud-config
              key: MYSQL_DATABASE
        ports:
        - containerPort: 3306
          name: mysql
        # La PRIMERA vez, MySQL inicializa el datadir y tarda ~30-60 s. Con
        # failureThreshold 60 y periodSeconds 5 se le dan hasta 5 minutos.
        readinessProbe:
          exec:
            command: ["sh", "-c", 'mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" --silent']
          periodSeconds: 5
          failureThreshold: 60
        livenessProbe:
          exec:
            command: ["sh", "-c", 'mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" --silent']
          initialDelaySeconds: 180
          periodSeconds: 20
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
        volumeMounts:
        - name: mysql-data
          mountPath: /var/lib/mysql
      volumes:
      - name: mysql-data
        persistentVolumeClaim:
          claimName: mysql-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-salud
spec:
  selector:
    app: mysql-salud
  ports:
    - port: 3306
      targetPort: 3306
