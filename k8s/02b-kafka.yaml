# ==========================================
# KAFKA (Log de eventos entre microservicios)
#
# Va numerado "02b" para que quede entre las bases de datos y los
# microservicios: "kubectl apply -f k8s/" respeta el orden alfabético, y los
# tres servicios de negocio necesitan el broker levantado antes de arrancar.
# ==========================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kafka-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-salud
spec:
  replicas: 1
  # Recreate (y no el RollingUpdate por defecto): apaga el Pod viejo ANTES de
  # crear el nuevo. Con RollingUpdate los dos coexistirían un instante, y aquí
  # eso rompe por partida doble: el PVC es ReadWriteOnce (un solo Pod puede
  # montarlo, el nuevo se quedaría en Pending) y dos brokers con el mismo
  # node.id sobre el mismo directorio de datos corrompen el log.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kafka-salud
  template:
    metadata:
      labels:
        app: kafka-salud
    spec:
      containers:
      - name: kafka
        image: apache/kafka:4.0.0
        env:
        # Modo KRaft: desde Kafka 4 ya no existe ZooKeeper. El mismo proceso
        # hace de broker y de controller, así que un solo Pod basta para clase.
        - name: KAFKA_NODE_ID
          value: "1"
        - name: KAFKA_PROCESS_ROLES
          value: broker,controller
        - name: KAFKA_CONTROLLER_QUORUM_VOTERS
          value: 1@kafka-salud:9093
        - name: KAFKA_CONTROLLER_LISTENER_NAMES
          value: CONTROLLER
        - name: KAFKA_LISTENERS
          value: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
        # advertised.listeners es la dirección que el broker le devuelve al
        # cliente para que se reconecte. Tiene que ser el nombre del Service,
        # que es lo único resoluble por DNS desde otros Pods. Si aquí se pusiera
        # localhost, los clientes conectarían la primera vez y fallarían en la
        # segunda: es el error más típico al desplegar Kafka en Kubernetes.
        - name: KAFKA_ADVERTISED_LISTENERS
          value: INTERNAL://kafka-salud:9092
        - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
          value: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT
        - name: KAFKA_INTER_BROKER_LISTENER_NAME
          value: INTERNAL
        # Con un solo broker no se puede replicar: si estos valores quedaran en
        # 3 (el defecto), los topics internos no se crearían y Kafka no arranca.
        - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
          value: "1"
        - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
          value: "1"
        - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
          value: "1"
        - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
          value: "0"
        - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
          value: "false"
        - name: CLUSTER_ID
          value: salud-kafka-cluster-01
        ports:
        - containerPort: 9092   # AMQP-equivalente: el puerto de los clientes
        - containerPort: 9093   # controller (interno de KRaft)
        readinessProbe:
          # Listar los topics obliga al broker a responder de verdad, no solo a
          # tener el puerto abierto.
          exec:
            command:
            - /bin/sh
            - -c
            - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list
          initialDelaySeconds: 25
          periodSeconds: 10
          failureThreshold: 12
        livenessProbe:
          tcpSocket:
            port: 9092
          initialDelaySeconds: 60
          periodSeconds: 30
        volumeMounts:
        - name: kafka-data
          mountPath: /var/lib/kafka/data
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "1536Mi"
      volumes:
      - name: kafka-data
        persistentVolumeClaim:
          claimName: kafka-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-salud
spec:
  selector:
    app: kafka-salud
  ports:
    - name: kafka
      port: 9092
      targetPort: 9092
    - name: controller
      port: 9093
      targetPort: 9093
---
# Consola web para ver topics, particiones y el lag de cada consumer group.
# Para abrirla: kubectl port-forward svc/kafka-ui-salud 8091:8080
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-ui-salud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-ui-salud
  template:
    metadata:
      labels:
        app: kafka-ui-salud
    spec:
      containers:
      - name: kafka-ui
        image: kafbat/kafka-ui:latest
        env:
        - name: KAFKA_CLUSTERS_0_NAME
          value: salud
        - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
          value: kafka-salud:9092
        - name: DYNAMIC_CONFIG_ENABLED
          value: "true"
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "768Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-ui-salud
spec:
  selector:
    app: kafka-ui-salud
  ports:
    - name: http
      port: 8080
      targetPort: 8080
