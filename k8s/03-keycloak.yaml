# ==========================================
# KEYCLOAK (Identity Provider)
#
# El realm (usuarios, roles y client) se monta desde el ConfigMap
# `keycloak-realm-config`. Ese ConfigMap NO se escribe a mano: lo genera
# kustomize a partir de keycloak/realm-export.json (ver kustomization.yaml en
# la raíz del proyecto). Por eso el despliegue se hace con:
#
#   kubectl apply -k .
#
# kustomize le añade al nombre un sufijo con el hash del contenido
# (keycloak-realm-config-abc123...) y actualiza la referencia de este
# Deployment automáticamente. Efecto útil: si editas el realm y vuelves a
# aplicar, el hash cambia y Keycloak se reinicia solo con el realm nuevo.
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak-salud
  labels:
    app: keycloak-salud
    tier: security
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: keycloak-salud
  template:
    metadata:
      labels:
        app: keycloak-salud
        tier: security
    spec:
      containers:
      - name: keycloak
        image: quay.io/keycloak/keycloak:25.0
        args: ["start-dev", "--import-realm"]
        env:
        - name: KC_DB
          valueFrom:
            configMapKeyRef:
              name: salud-config
              key: KC_DB
        - name: KEYCLOAK_ADMIN
          valueFrom:
            secretKeyRef:
              name: salud-secrets
              key: KC_ADMIN
        - name: KEYCLOAK_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: salud-secrets
              key: KC_ADMIN_PASSWORD
        - name: KC_HEALTH_ENABLED
          value: "true"
        # URL pública con la que Keycloak firma el claim "iss" de los tokens.
        # Debe coincidir con SPRING_..._ISSUER_URI del ConfigMap (01-config.yaml)
        # y con la URL que uses para pedir el token (kubectl port-forward).
        - name: KC_HOSTNAME
          value: localhost
        - name: KC_HOSTNAME_PORT
          value: "8080"
        - name: KC_HOSTNAME_STRICT
          value: "false"
        - name: KC_HOSTNAME_STRICT_BACKCHANNEL
          value: "false"
        - name: KC_HTTP_ENABLED
          value: "true"
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 9000
          name: health
        # Keycloak 25 expone /health/* en el puerto de GESTIÓN 9000, no en el 8080.
        #
        # startupProbe: mientras no pase, K8s NO ejecuta readiness ni liveness.
        # Es la forma correcta de darle a un arranque lento todo el tiempo que
        # necesite (aquí 5 min) sin tener que inflar initialDelaySeconds en la
        # sonda de liveness, que es lo que mata Pods sanos en máquinas lentas.
        startupProbe:
          httpGet:
            path: /health/started
            port: 9000
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 9000
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health/live
            port: 9000
          periodSeconds: 20
          failureThreshold: 3
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
        volumeMounts:
        - name: realm-config
          mountPath: /opt/keycloak/data/import/
          readOnly: true
      volumes:
      - name: realm-config
        configMap:
          name: keycloak-realm-config
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak-salud
spec:
  type: NodePort
  selector:
    app: keycloak-salud
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
