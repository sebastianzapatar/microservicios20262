# ==========================================
# EUREKA SERVER (Service Discovery)
#
# imagePullPolicy: Never -> usa la imagen del daemon Docker de Minikube.
# Recuerda construirla primero con:  eval $(minikube docker-env)
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eureka-server
  template:
    metadata:
      labels:
        app: eureka-server
    spec:
      containers:
      - name: eureka
        image: eureka-server:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8761
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8761
          initialDelaySeconds: 20
          periodSeconds: 10
          failureThreshold: 15
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8761
          initialDelaySeconds: 60
          periodSeconds: 20
        resources:
          requests:
            memory: "384Mi"
            cpu: "200m"
          limits:
            memory: "768Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: eureka-server
spec:
  type: NodePort
  selector:
    app: eureka-server
  ports:
    - port: 8761
      targetPort: 8761
      nodePort: 30876
