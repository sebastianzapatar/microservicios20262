# ==========================================
# EUREKA SERVER (Service Discovery)
#
# imagePullPolicy: Never -> "no bajes nada de internet, usa la imagen que ya
# está en el nodo". Por eso hay que construir las imágenes DENTRO del Docker
# de Minikube:  eval $(minikube docker-env)  antes de  docker build.
# Si falta la imagen, el Pod falla con un error explícito
# ("Container image ... is not present with pull policy of Never"),
# que es más claro que un ImagePullBackOff contra Docker Hub.
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka-server
  labels:
    app: eureka-server
    tier: discovery
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eureka-server
  template:
    metadata:
      labels:
        app: eureka-server
        tier: discovery
    spec:
      containers:
      - name: eureka
        image: eureka-server:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8761
          name: http
        # Ver la nota sobre startupProbe en 03-keycloak.yaml.
        # Una JVM con Spring Boot en Minikube puede tardar 60-120 s en arrancar.
        startupProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8761
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8761
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8761
          periodSeconds: 20
          failureThreshold: 3
        resources:
          requests:
            memory: "384Mi"
            cpu: "200m"
          limits:
            memory: "768Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: eureka-server
spec:
  type: NodePort
  selector:
    app: eureka-server
  ports:
    - name: http
      port: 8761
      targetPort: 8761
      nodePort: 30876
