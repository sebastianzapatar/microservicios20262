services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres-salud
    environment:
      POSTGRES_DB: pacientes_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - salud-network

  mongodb:
    image: mongo:7
    container_name: mongo-salud
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: historial_medico_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - salud-network

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: keycloak-salud
    environment:
      KC_DB: dev-mem
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    command: start-dev --import-realm
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    networks:
      - salud-network

volumes:
  postgres_data:
  mongo_data:

networks:
  salud-network:
    driver: bridge
