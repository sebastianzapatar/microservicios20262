services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres-salud
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - salud-network

  mongodb:
    image: mongo:7
    container_name: mongo-salud
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - salud-network

  mysql:
    image: mysql:8.0
    container_name: mysql-salud
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks:
      - salud-network

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: keycloak-salud
    environment:
      KC_DB: ${KC_DB}
      KEYCLOAK_ADMIN: ${KC_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      # El "issuer" de los tokens se construye con esta URL pública. Se fija a
      # localhost:8080 (la URL que usan los estudiantes desde el navegador o
      # curl) para que el claim "iss" coincida con lo que validan los servicios.
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: "8080"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_BACKCHANNEL: "false"
      KC_HTTP_ENABLED: "true"
    command: start-dev --import-realm
    ports:
      - "${KC_PORT}:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    networks:
      - salud-network

  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    container_name: eureka-server
    ports:
      - "${EUREKA_PORT}:8761"
    restart: unless-stopped
    networks:
      - salud-network

  gateway-service:
    build:
      context: ./gateway-service
      dockerfile: Dockerfile
    container_name: gateway-service
    ports:
      - "${GATEWAY_PORT}:8090"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      # ISSUER_URI = URL pública de Keycloak (lo que trae el claim "iss" del token).
      # JWK_SET_URI = URL interna, la única resoluble desde dentro de la red Docker.
      # Si solo se usara issuer-uri, el servicio intentaría descargar las llaves
      # desde localhost:8080 (su propio contenedor) y fallaría.
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://localhost:8080/realms/salud-system
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://keycloak-salud:8080/realms/salud-system/protocol/openid-connect/certs
    depends_on:
      - eureka-server
      - keycloak
    restart: unless-stopped
    networks:
      - salud-network

  pacientes-service:
    build:
      context: ./pacientes-service
      dockerfile: Dockerfile
    container_name: pacientes-service
    ports:
      - "${PACIENTES_PORT}:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-salud:5432/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://localhost:8080/realms/salud-system
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://keycloak-salud:8080/realms/salud-system/protocol/openid-connect/certs
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_started
      keycloak:
        condition: service_started
    restart: unless-stopped
    networks:
      - salud-network

  historial-medico-service:
    build:
      context: ./historial-medico-service
      dockerfile: Dockerfile
    container_name: historial-medico-service
    ports:
      - "${HISTORIAL_PORT}:8082"
    environment:
      - SPRING_MONGODB_URI=mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo-salud:27017/${MONGO_DB}?authSource=admin
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://localhost:8080/realms/salud-system
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://keycloak-salud:8080/realms/salud-system/protocol/openid-connect/certs
    depends_on:
      mongodb:
        condition: service_healthy
      eureka-server:
        condition: service_started
      keycloak:
        condition: service_started
    restart: unless-stopped
    networks:
      - salud-network

  pacientes-fastapi-service:
    build:
      context: ./pacientes-fastapi-service
      dockerfile: Dockerfile
    container_name: pacientes-fastapi-service
    ports:
      - "${PACIENTES_FASTAPI_PORT}:8083"
    environment:
      # MongoDB (lectura del historial médico)
      - MONGO_USER=${MONGO_USER}
      - MONGO_PASSWORD=${MONGO_PASSWORD}
      - MONGO_DB=${MONGO_DB}
      - MONGO_HOST=mongo-salud
      - MONGO_PORT=27017
      # MySQL (tabla de usuarios). El puerto es el INTERNO del contenedor (3306),
      # no ${MYSQL_PORT}, que es el puerto publicado hacia el host.
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_HOST=mysql-salud
      - MYSQL_PORT=3306
      # Eureka: se anuncia con el nombre del contenedor para que el Gateway
      # pueda alcanzarlo dentro de la red de Docker.
      - EUREKA_SERVER=http://eureka-server:8761/eureka/
      - INSTANCE_HOST=pacientes-fastapi-service
      - PACIENTES_FASTAPI_PORT=8083
    depends_on:
      mongodb:
        condition: service_healthy
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
    restart: unless-stopped
    networks:
      - salud-network

volumes:
  postgres_data:
  mongo_data:
  mysql_data:

networks:
  salud-network:
    driver: bridge
