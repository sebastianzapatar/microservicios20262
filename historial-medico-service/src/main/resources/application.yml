server:
  port: 8082

spring:
  application:
    name: HISTORIAL-MEDICO-SERVICE

  # MongoDB Configuration
  # OJO: en Spring Boot 4 la propiedad "spring.data.mongodb.uri" fue ELIMINADA.
  # Si se usa la antigua, Spring la ignora en silencio y se conecta a localhost:27017.
  mongodb:
    uri: mongodb://admin:admin123@localhost:27017/historial_medico_db?authSource=admin

  # OAuth2 Resource Server - Keycloak JWT
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/salud-system

# Eureka Client Configuration
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

# Logging
logging:
  level:
    com.salud.historial: DEBUG
    org.springframework.security: DEBUG

# Actuator - health checks para Docker Compose y Kubernetes (probes)
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
